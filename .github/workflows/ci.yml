name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version_consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare Cargo.toml and frontend/package.json versions
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          package_version=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")

          echo "Cargo.toml version: ${cargo_version}"
          echo "frontend/package.json version: ${package_version}"

          if [ "${cargo_version}" != "${package_version}" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version} frontend/package.json=${package_version}"
            exit 1
          fi

  backend:
    name: Backend cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Run cargo test
        run: cargo test --locked

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose configuration
        run: |
          cp .env.example .env
          docker compose config

  compose_smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Docker Compose smoke test
        run: bash scripts/smoke-compose.sh
