name: Publish Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-native-artifact:
    name: Build native release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package Linux native release
        id: package
        run: |
          bash scripts/package-native-release.sh "${GITHUB_REF_NAME}"
          echo "artifact_path=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Upload native release artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ github.ref_name }}-linux-x86_64
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

  build-and-push:
    name: Build and push release image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          IMAGE=kpakozz96pyc/oxiderelay
          TAGS="${IMAGE}:${GITHUB_REF_NAME}"
          # Only float `latest` for stable releases (no pre-release suffix, e.g. v1.2.3-rc1).
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
